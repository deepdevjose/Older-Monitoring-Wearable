<script>
(() => {
  const root = document.getElementById('care-monitor-redesign-preview');
  if (!root) return;
  const defaults = () => ({screen:'home',module:'max',menu:false,notice:'',acknowledged:false,appearance:'System',profile:{name:'Eleanor Chen',age:'72',caregiver:'Alex Morgan'}});
  const state = {clear:defaults(),focus:defaults()};
  const controls = {clear:{appearance:'Light',status:'Readings stable'},focus:{appearance:'Dark',status:'Readings stable'}};
  const deviceId = 'elder-demo-01';
  const modules = [
    {id:'max',name:'Heart & oxygen',chip:'MAX30102',icon:'heart-pulse',series:'var(--cm-hr)',value:'76',unit:'BPM',values:[72,74,75,73,76,74,78,76,75,77,76,76]},
    {id:'temperature',name:'Temperature',chip:'GY906',icon:'thermometer',series:'var(--cm-surface-temperature)',value:'33.5',unit:'°C surface',values:[33.1,33.3,33.2,33.4,33.5,33.4,33.5,33.5]},
    {id:'movement',name:'Movement',chip:'MPU6050',icon:'activity',series:'var(--cm-accent)',value:'1.00',unit:'g · Z axis',values:[1,.99,1.02,1.01,.98,1.02,1,1]},
    {id:'sound',name:'Sound',chip:'Microphone',icon:'mic',series:'var(--cm-accent)',value:'150',unit:'raw ADC',values:[95,120,105,145,110,180,135,150]},
    {id:'light',name:'Light',chip:'Photoresistor',icon:'sun',series:'var(--cm-warn)',value:'48.8',unit:'% ADC range',values:[1800,1900,1850,2050,2150,2080,1990,2000]},
    {id:'buzzer',name:'Buzzer',chip:'Actuator',icon:'volume-2',series:'var(--cm-muted)',value:'Unknown',unit:'reported state',values:[]}
  ];
  const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const isUnknown = id => controls[id].status === 'No recent readings';
  const isAttention = id => controls[id].status === 'Needs attention';
  const currentSpo2 = id => isUnknown(id) ? '—' : isAttention(id) ? '92' : '98';
  const compact = (values,color) => {
    if (!values.length) return '';
    const low=Math.min(...values),high=Math.max(...values),spread=Math.max(high-low,1);
    const points=values.map((v,i)=>`${8+i*284/(values.length-1)},${39-(v-low)*29/spread}`).join(' ');
    return `<svg class="cm-mini" viewBox="0 0 300 48" role="img" aria-label="Illustrative simulated trend"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="292" cy="${39-(values[values.length-1]-low)*29/spread}" r="4" fill="${color}"/></svg>`;
  };
  function donut(value,max,unit,color,label) {
    const known=value!==null,portion=known?Math.max(0,Math.min(value/max,1)):0;
    return `<svg class="cm-donut" viewBox="0 0 120 120" role="img" aria-label="${esc(label)}"><circle cx="60" cy="60" r="45" fill="none" stroke="var(--cm-line)" stroke-width="8"/><circle cx="60" cy="60" r="45" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${portion*283} 283" transform="rotate(-90 60 60)"/><text x="60" y="59" text-anchor="middle">${known?esc(value):'—'}</text><text class="cm-donut-unit" x="60" y="79" text-anchor="middle">${esc(unit)}</text></svg>`;
  }
  function chart(values,color,unit,label,style='line') {
    const min=Math.min(...values),max=Math.max(...values),pad=Math.max((max-min)*.3,unit==='%'?1:unit==='°C'?.3:2);
    const low=min-pad,high=max+pad,px=i=>45+i*246/(values.length-1),py=v=>117-(v-low)*89/(high-low);
    let marks='';
    if(style==='bars') marks=values.map((v,i)=>`<rect x="${px(i)-5}" y="${py(v)}" width="10" height="${117-py(v)}" rx="5" fill="${color}"/>`).join('');
    else marks=`<path d="M ${values.map((v,i)=>`${px(i)} ${py(v)}`).join(' L ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="291" cy="${py(values[values.length-1])}" r="4" fill="${color}"/>`;
    const format=v => unit==='°C'?v.toFixed(1):Math.round(v);
    return `<svg class="cm-chart" viewBox="0 0 320 165" role="img" aria-label="${esc(label)}; illustrative simulated history"><text x="3" y="17">${esc(unit)}</text>${[low,(low+high)/2,high].map(v=>`<line class="cm-grid-line" x1="43" x2="298" y1="${py(v)}" y2="${py(v)}"/><text x="34" y="${py(v)+5}" text-anchor="end">${format(v)}</text>`).join('')}${marks}<text x="44" y="144">−60</text><text x="167" y="144" text-anchor="middle">−30</text><text x="297" y="144" text-anchor="end">Now</text><text x="298" y="162" text-anchor="end">Time (min)</text></svg>`;
  }
  const empty = label => `<div class="cm-empty">${icon('signal-zero')}<strong>No recent readings</strong><span>${esc(label)} will appear when valid data is available.</span></div>`;
  function statusCard(id) {
    const unknown=isUnknown(id),attention=isAttention(id);
    return `<section class="cm-surface cm-status ${unknown?'cm-unknown':attention?'cm-attention':''}" aria-label="Demo patient status"><div class="cm-status-icon">${icon(unknown?'circle-help':attention?'triangle-alert':'shield-check')}</div><div><span class="cm-kicker">Patient status · demo</span><h2>${controls[id].status}</h2><span class="cm-sub">${unknown?'Check the device connection':attention?'Blood oxygen reading needs review':'Current readings look consistent'}</span><small>Simulated readings · not a diagnosis</small>${attention?'<button class="cm-link cursor-interaction" data-screen="alerts">Review alert →</button>':''}</div></section>`;
  }
  function home(id) {
    const s=state[id],unknown=isUnknown(id),hr=unknown?'—':'76',spo2=currentSpo2(id);
    const patient=`<div class="cm-patient"><div><strong>${esc(id==='focus'?s.profile.name.split(' ')[0]+"’s overview":s.profile.name)}</strong><span class="cm-sub">Patient 001 · ${esc(s.profile.age)} years</span></div><button class="cm-link cursor-interaction" data-screen="profile">View profile</button></div>`;
    const hrTile=`<button class="cm-metric cursor-interaction" style="--cm-series:var(--cm-hr)" data-module="max"><span class="cm-metric-icon">${icon('heart-pulse')}</span><span class="cm-metric-label">Heart rate</span><span class="cm-value">${hr}<small>BPM</small></span>${unknown?'<span class="cm-sub">No recent data</span>':compact(modules[0].values,'var(--cm-hr)')}</button>`;
    const o2Tile=`<button class="cm-metric cursor-interaction" style="--cm-series:var(--cm-o2)" data-module="max"><span class="cm-metric-icon">${icon('droplets')}</span><span class="cm-metric-label">Blood oxygen</span><span class="cm-value">${spo2}<small>%</small></span>${unknown?'<span class="cm-sub">No recent data</span>':compact(isAttention(id)?[98,98,97,96,96,94,93,92]:[98,98,97,98,98,99,98,98],'var(--cm-o2)')}</button>`;
    const temperature=`<button class="cm-metric cm-full cursor-interaction" style="--cm-series:var(--cm-warn)" data-module="temperature"><div class="cm-temp"><div><span class="cm-metric-label">Surface temperature</span><div class="cm-value">${unknown?'—':'33.5'}<small>°C</small></div><span class="cm-sub">Ambient ${unknown?'—':'24.1'} °C</span></div>${icon('thermometer')}</div></button>`;
    const focusVitals=`<button class="cm-featured cursor-interaction" data-module="max"><div class="cm-topline"><span>Heart rate</span><span class="cm-sub">${hr} BPM</span></div>${unknown?'<p class="cm-sub">No recent data</p>':compact(modules[0].values,'var(--cm-hr)')}<span class="cm-sub">Illustrative trend · 60 min</span></button><button class="cm-featured cm-split cursor-interaction" data-module="max"><div><span>Blood oxygen</span><div class="cm-value">${spo2}<small>%</small></div><span class="cm-sub">Latest simulated reading</span></div>${donut(unknown?null:Number(spo2),100,'SpO₂ %','var(--cm-o2)','Simulated blood oxygen '+spo2+' percent')}</button>`;
    return patient+statusCard(id)+`<div class="cm-section-head"><h2>Vital signs</h2><button class="cm-link cursor-interaction" data-screen="sensors">All sensors →</button></div>`+(id==='focus'?focusVitals:`<div class="cm-grid">${hrTile}${o2Tile}${temperature}</div>`)+`<div class="cm-secondary">${icon(unknown?'wifi-off':'radio')}<div><strong>${unknown?'Device needs checking':'Device connected · demo'}</strong><div class="cm-device-id">Device ID: ${esc(deviceId)}</div><div class="cm-sub">${unknown?'Latest readings unavailable':'5 sensors + 1 actuator'}</div></div><button class="cm-link cursor-interaction" data-screen="sensors">View</button></div><p class="cm-footnote">Illustrative trends · simulated data only</p>`;
  }
  function sensors(id) {
    return `<h2 class="cm-page-title">Sensor modules</h2><p class="cm-page-sub">A visual view of each connected module</p><div class="cm-grid cm-modules">${modules.map(m=>`<button class="cm-metric cursor-interaction" style="--cm-series:${m.series}" data-module="${m.id}"><span class="cm-metric-icon">${icon(m.icon)}</span><span class="cm-metric-label">${m.name}</span><span class="cm-value">${isUnknown(id)&&m.id!=='buzzer'?'—':m.value}</span><span class="cm-sub">${m.unit}</span>${!isUnknown(id)?compact(m.values,m.series):''}<span class="cm-footnote">${m.chip} →</span></button>`).join('')}</div><p class="cm-footnote">Demo data · tap a module for its charts</p>`;
  }
  function graphCard(name,value,unit,values,color,description,id,style='line') {
    const graphicLabel=isUnknown(id)?name+': no recent readings':name+' simulated '+value+' '+unit;
    const graphic=unit==='%'||unit==='ADC'?donut(isUnknown(id)?null:Number(value),unit==='%'?100:4095,unit,color,graphicLabel):`<div class="cm-detail-glyph">${icon(unit==='BPM'?'heart-pulse':'thermometer')}</div>`;
    return `<section class="cm-surface"><div class="cm-detail-head" style="--cm-series:${color}"><div><h3>${name}</h3><div class="cm-value">${isUnknown(id)?'—':value}<small>${unit}</small></div></div>${graphic}</div>${isUnknown(id)?empty(name):chart(values,color,unit,name,style)}<p class="cm-footnote">${description}</p><p class="cm-footnote">Illustrative trend · simulated data</p></section>`;
  }
  function detail(id) {
    const m=modules.find(x=>x.id===state[id].module)||modules[0];
    let body=`<div class="cm-period"><span>Latest hour</span><span class="cm-chip">${m.chip}</span></div>`;
    if(m.id==='max') body+=graphCard('Heart rate','76','BPM',m.values,'var(--cm-hr)','Estimated heart rate',id)+graphCard('Blood oxygen',currentSpo2(id),'%',[98,98,97,98,98,97,98,Number(currentSpo2(id))||98],'var(--cm-o2)','Estimated SpO₂',id);
    else if(m.id==='temperature') body+=graphCard('Surface temperature','33.5','°C',m.values,m.series,'Surface temperature, separate from core body temperature',id)+graphCard('Ambient temperature','24.1','°C',[23.8,24,24.1,24,24.1,24.1],'var(--cm-ambient-temperature)','Surrounding air temperature',id);
    else if(m.id==='movement') {
      body+=`<section class="cm-surface"><h3>Acceleration</h3>${isUnknown(id)?empty('Acceleration'):`<div class="cm-axis-values"><span>X<b>0.02</b>g</span><span>Y<b>−0.01</b>g</span><span>Z<b>1.00</b>g</span></div><svg class="cm-chart" viewBox="0 0 320 150" role="img" aria-label="Simulated acceleration X 0.02 g, Y minus 0.01 g, Z 1.00 g"><line class="cm-grid-line" x1="35" x2="294" y1="110" y2="110"/><text x="8" y="113">0</text><text x="8" y="32">1g</text><rect x="64" y="105" width="36" height="5" rx="3" fill="var(--cm-accent)"/><rect x="142" y="110" width="36" height="3" rx="2" fill="var(--cm-accent)"/><rect x="220" y="28" width="36" height="82" rx="7" fill="var(--cm-accent)"/><text x="82" y="139" text-anchor="middle">X</text><text x="160" y="139" text-anchor="middle">Y</text><text x="238" y="139" text-anchor="middle">Z</text></svg>`}<p class="cm-footnote">Latest sample · simulated data</p></section>`;
      body+=`<section class="cm-surface"><h3>Angular velocity</h3>${isUnknown(id)?empty('Angular velocity'):`<div class="cm-axis-values"><span>X<b>0.10</b>°/s</span><span>Y<b>−0.20</b>°/s</span><span>Z<b>0.00</b>°/s</span></div><svg class="cm-chart" viewBox="0 0 320 180" role="img" aria-label="Simulated angular velocity: X 0.10, Y minus 0.20, Z zero degrees per second"><text x="4" y="17">°/s</text><line class="cm-grid-line" x1="48" x2="296" y1="35" y2="35"/><line class="cm-grid-line" x1="48" x2="296" y1="87" y2="87"/><line class="cm-grid-line" x1="48" x2="296" y1="139" y2="139"/><text x="39" y="40" text-anchor="end">0.3</text><text x="39" y="92" text-anchor="end">0</text><text x="39" y="144" text-anchor="end">−0.3</text><rect x="64" y="69.67" width="36" height="17.33" rx="4" fill="var(--cm-accent)"/><rect x="142" y="87" width="36" height="34.67" rx="4" fill="var(--cm-accent)"/><circle cx="238" cy="87" r="4" fill="var(--cm-accent)"/><text x="82" y="168" text-anchor="middle">X</text><text x="160" y="168" text-anchor="middle">Y</text><text x="238" y="168" text-anchor="middle">Z</text></svg>`}<p class="cm-footnote">Latest sample · no fall classification</p></section>`;
    } else if(m.id==='sound') body+=graphCard('Relative sound','150','ADC',m.values,m.series,'Raw ADC counts · not calibrated decibels',id,'bars');
    else if(m.id==='light') body+=graphCard('Relative light','2000','ADC',m.values,m.series,isUnknown(id)?'Relative ADC range · not calibrated lux':'48.8% of the ADC range · not calibrated lux',id)+`<section class="cm-surface cm-split"><div><h3>ADC range</h3><span class="cm-sub">Relative light reading</span></div>${donut(isUnknown(id)?null:48.8,100,'% of ADC',m.series,isUnknown(id)?'Relative light: no recent readings':'Relative light 48.8 percent of ADC range')}</section>`;
    else body+=`<section class="cm-surface"><div class="cm-empty">${icon('volume-x')}<strong>State unknown</strong><span>The device reports its pin, but no on/off state.</span></div><div class="cm-detail-info"><span class="cm-chip">GPIO 25</span><span class="cm-chip">Actuator</span></div><p class="cm-footnote">Activity history will appear when device state is available.</p></section>`;
    return body;
  }
  function alerts(id) {
    const attention=isAttention(id),unknown=isUnknown(id),ack=state[id].acknowledged;
    if(!attention) return `<h2 class="cm-page-title">Alerts</h2><p class="cm-page-sub">Updates that need your review</p><section class="cm-surface"><div class="cm-empty">${icon(unknown?'signal-zero':'shield-check')}<strong>${unknown?'No recent readings':'No new alerts'}</strong><span>${unknown?'Check the device before assessing the readings.':'New alerts will appear here.'}</span></div></section>`;
    return `<h2 class="cm-page-title">Alerts</h2><p class="cm-page-sub">${ack?'Reviewed':'1 item needs review'} · demo</p><section class="cm-surface"><div class="cm-chip">${icon(ack?'check':'triangle-alert')}${ack?'Acknowledged':'Needs attention'}</div><h2 style="font-size:21px;margin-top:16px">Blood oxygen reading</h2><div class="cm-value">92<small>% · simulated</small></div><p class="cm-sub">Patient 001 · ${esc(state[id].profile.name)}</p><p class="cm-sub">Review the reading and check the sensor placement.</p>${ack?'<p class="cm-footnote">Acknowledged in this preview</p>':'<button class="cm-primary cursor-interaction" data-action="acknowledge">'+icon('check')+'Acknowledge</button>'}<div class="cm-risk-line">${icon('info')}<span>Acknowledging records review. It does not confirm that the condition is resolved.</span></div></section>`;
  }
  function profile(id) {
    const p=state[id].profile;
    return `<div class="cm-profile-hero"><div class="cm-profile-avatar">${icon('user-round')}</div><h2>${esc(p.name)}</h2><span class="cm-sub">Patient profile · example</span></div><form data-profile-form><section class="cm-surface"><h3 style="margin-bottom:17px">Personal details</h3><label class="cm-field">Patient name<input name="patientName" value="${esc(p.name)}" required maxlength="40" autocomplete="off"></label><div class="cm-field-row"><label class="cm-field">Age<input name="patientAge" type="number" min="1" max="120" value="${esc(p.age)}" required></label><label class="cm-field">Patient ID<input value="Patient 001" readonly></label></div><label class="cm-field">Caregiver name<input name="caregiverName" value="${esc(p.caregiver)}" maxlength="40" autocomplete="off"></label></section><section class="cm-surface"><h3>Linked device</h3><div class="cm-settings-row">${icon('radio')}<div><strong>${esc(deviceId)}</strong><span class="cm-sub">5 sensors + 1 buzzer actuator</span></div></div><p class="cm-footnote">Example profile · changes stay in this preview</p></section><button class="cm-primary cursor-interaction" type="submit">${icon('check')}Save profile</button></form>`;
  }
  function settings() {
    return `<h2 class="cm-page-title">Settings</h2><p class="cm-page-sub">Connection and application information</p><section class="cm-surface"><div class="cm-settings-row">${icon('server')}<div><strong>Backend connection</strong><span class="cm-sub">Not connected · demo data</span></div></div><div class="cm-settings-row">${icon('bell')}<div><strong>Notifications</strong><span class="cm-sub">In-app alerts only in this preview</span></div></div><div class="cm-settings-row">${icon('shield-check')}<div><strong>Data source</strong><span class="cm-sub">Simulated sensor readings</span></div></div></section><section class="cm-surface"><h3>About Care Monitor</h3><p class="cm-sub">Older-adult monitoring interface</p><p class="cm-footnote">Design preview · no live device connection</p></section>`;
  }
  function remember() {
    const designs={};
    for(const id of ['clear','focus']) designs[id]={screen:state[id].screen,module:state[id].module,appearance:controls[id].appearance,status:controls[id].status};
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{preview:'care-monitor-redesign',designs},privateContent:null}).catch(()=>{});
  }
  function restore(saved) {
    const data=saved?.modelContent||saved;
    if(data?.preview!=='care-monitor-redesign') return;
    for(const id of ['clear','focus']) {
      const v=data.designs?.[id]; if(!v) continue;
      if(['home','sensors','detail','alerts','profile','settings'].includes(v.screen)) state[id].screen=v.screen;
      if(modules.some(m=>m.id===v.module)) state[id].module=v.module;
      if(['Light','Dark','System'].includes(v.appearance)) controls[id].appearance=v.appearance;
      if(['Readings stable','Needs attention','No recent readings'].includes(v.status)) controls[id].status=v.status;
    }
  }
  function render(id) {
    const phone=root.querySelector(`[data-design="${id}"]`),s=state[id],c=controls[id];
    phone.style.colorScheme=c.appearance==='System'?'light dark':c.appearance.toLowerCase();
    const titles={home:'Care Monitor',sensors:'Care Monitor',alerts:'Care Monitor',profile:'Profile',settings:'Settings'};
    const m=modules.find(x=>x.id===s.module)||modules[0],detailPage=s.screen==='detail',subPage=detailPage||s.screen==='settings';
    const heading=detailPage?m.name:titles[s.screen];
    const pages={home:()=>home(id),sensors:()=>sensors(id),detail:()=>detail(id),alerts:()=>alerts(id),profile:()=>profile(id),settings};
    const active=detailPage?'sensors':s.screen==='settings'?'profile':s.screen;
    phone.innerHTML=`<div class="cm-system"><span>09:41</span><span>${icon('wifi')}${icon('battery-full')}</span></div><header class="cm-header">${subPage?'<button class="cm-icon-button cursor-interaction" data-action="back" aria-label="Back">'+icon('arrow-left')+'</button>':''}<h1 class="cm-brand">${heading}</h1>${s.screen==='home'?'<button class="cm-icon-button cm-avatar cursor-interaction" data-screen="profile" aria-label="Open profile">'+icon('user-round')+'</button>':''}<button class="cm-icon-button cursor-interaction" data-action="menu" aria-label="More options" aria-expanded="${s.menu}">${icon('ellipsis-vertical')}</button>${s.menu?'<div class="cm-overflow" aria-label="More options"><button class="cursor-interaction" data-screen="settings">'+icon('settings')+'Settings</button><button class="cursor-interaction" data-action="about">'+icon('info')+'About</button></div>':''}</header><div class="cm-demo"><b>Demo data</b><span>Simulated readings</span></div><main class="cm-main">${pages[s.screen]()}</main>${s.notice?'<div class="cm-toast" role="status">'+esc(s.notice)+'</div>':''}<nav class="cm-nav" aria-label="Main navigation">${[['home','house','Home'],['sensors','activity','Sensors'],['alerts','bell','Alerts'],['profile','user-round','Profile']].map(([page,glyph,label])=>`<button class="cursor-interaction" data-screen="${page}" ${active===page?'aria-current="page"':''}>${icon(glyph)}${page==='alerts'&&isAttention(id)&&!s.acknowledged?'<span class="cm-alert-dot">1</span>':''}<span>${label}</span></button>`).join('')}</nav><div class="cm-home-bar"></div>`;
    if(globalThis.lucide) lucide.createIcons({root:phone,attrs:{width:18,height:18}});
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button'),phone=event.target.closest('[data-design]');
    if(!button||!phone) return;
    const id=phone.dataset.design,s=state[id];
    if(button.dataset.screen){s.screen=button.dataset.screen;s.menu=false;s.notice='';}
    else if(button.dataset.module){s.module=button.dataset.module;s.screen='detail';s.menu=false;s.notice='';}
    else if(button.dataset.action==='menu') s.menu=!s.menu;
    else if(button.dataset.action==='back'){s.screen=s.screen==='detail'?'sensors':'home';s.menu=false;s.notice='';}
    else if(button.dataset.action==='about'){s.screen='settings';s.menu=false;}
    else if(button.dataset.action==='acknowledge'){s.acknowledged=true;s.notice='Alert reviewed in this preview';}
    else return;
    render(id);remember();
  });
  root.addEventListener('submit',event=>{
    if(!event.target.matches('[data-profile-form]')) return;
    event.preventDefault();
    const phone=event.target.closest('[data-design]'),id=phone.dataset.design,form=event.target;
    const name=form.elements.namedItem('patientName').value.trim();
    const age=form.elements.namedItem('patientAge').value;
    if(!name||Number(age)<1||Number(age)>120) return;
    state[id].profile={name,age,caregiver:form.elements.namedItem('caregiverName').value.trim()};
    state[id].notice='Profile updated in this preview';render(id);
  });
  restore(window.openai?.widgetState);
  for(const id of ['clear','focus']) {
    render(id);
    if(globalThis.Tweak) {
      const phone=root.querySelector(`[data-design="${id}"]`);
      const tweak=new Tweak({container:phone,onChange:()=>{state[id].acknowledged=false;state[id].notice='';render(id);remember();}});
      tweak.addSelect(controls[id],'appearance',{label:'Appearance',options:['Light','Dark','System']});
      tweak.addSelect(controls[id],'status',{label:'Status preview',options:['Readings stable','Needs attention','No recent readings']});
    }
  }
  window.addEventListener('openai:set_globals',event=>{
    const saved=event.detail?.globals?.widgetState;
    if(saved){restore(saved);render('clear');render('focus');}
  });
})();
</script>
