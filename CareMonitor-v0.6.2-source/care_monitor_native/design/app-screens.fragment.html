<div id="care-monitor-screens" class="viz-dotted-background">
  <div class="cm-preview-tools">
    <label>Screen <select id="cm-screen"><option value="login">Login</option><option value="signup">Sign Up</option><option value="overview">Overview</option><option value="sensors">Sensors</option><option value="sensor-detail">Sensor details</option><option value="alerts">Alerts</option><option value="alert-detail">Alert details</option><option value="settings">Settings</option></select></label>
    <label>Demo scenario <select id="cm-scenario"><option value="routine">Routine</option><option value="alert">Low oxygen alert</option><option value="unavailable">No finger detected</option><option value="offline">Device offline</option></select></label>
  </div>
  <section class="cm-phone" aria-label="Care Monitor Android screen">
    <div class="cm-system"><span>9:41</span><span aria-label="Network and battery">LTE · 100%</span></div>
    <div id="cm-content" aria-live="polite"></div>
  </section>
</div>
<style>
#care-monitor-screens { color-scheme: light dark; padding: 18px 0; }
#care-monitor-screens * { box-sizing: border-box; }
#care-monitor-screens .cm-preview-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 0 0 18px; }
#care-monitor-screens .cm-preview-tools label { display: flex; flex-direction: column; gap: 5px; font: 12px/1.4 system-ui, sans-serif; color: light-dark(#475b59,#bbcfcc); }
#care-monitor-screens .cm-preview-tools select { padding: 8px 12px; border: 1px solid light-dark(#c9d9d6,#435955); border-radius: 9px; color: light-dark(#1a3431,#e2efec); background: light-dark(#fff,#203631); font: 16px/1.4 system-ui, sans-serif; max-width:100%; }
#care-monitor-screens .cm-phone { --cm-bg: light-dark(#f3f7f6,#142320); --cm-surface: light-dark(#ffffff,#20332f); --cm-text: light-dark(#163630,#e9f2ef); --cm-muted: light-dark(#586f69,#b0c9c1); --cm-border: light-dark(#dbe6e2,#3b514a); --cm-teal: light-dark(#126c67,#87d4c4); --cm-on-teal: light-dark(#ffffff,#003c33); --cm-soft: light-dark(#e2f3ed,#21473d); --cm-alert: light-dark(#9b4f10,#ffd3a3); --cm-alert-bg: light-dark(#fff1df,#543616); max-width: 390px; min-height: 790px; margin: 0 auto; border: 1px solid var(--cm-border); border-radius: 30px; overflow: hidden; color: var(--cm-text); background: var(--cm-bg); font: 14px/1.45 'Segoe UI',Arial,sans-serif; box-shadow: 0 14px 36px light-dark(#173b3020,#00000040); }
#care-monitor-screens .cm-phone button, #care-monitor-screens .cm-phone input, #care-monitor-screens .cm-phone select { font: inherit; }
#care-monitor-screens .cm-phone button { color: inherit; }
#care-monitor-screens .cm-system { display:flex; justify-content:space-between; padding:14px 23px 10px; color:var(--cm-text); font-size:12px; font-weight:600; }
#care-monitor-screens #cm-content { min-height:746px; display:flex; flex-direction:column; }
#care-monitor-screens .cm-main { padding: 11px 20px 20px; flex:1; }
#care-monitor-screens .cm-top { display:flex; align-items:center; justify-content:space-between; margin:5px 0 20px; gap:12px; }
#care-monitor-screens .cm-top h1 { font-size:24px; line-height:1.2; font-weight:600; margin:0; letter-spacing:-.6px; }
#care-monitor-screens .cm-top p { font-size:12px; margin:5px 0 0; color:var(--cm-muted); }
#care-monitor-screens .cm-avatar { width:40px; height:40px; display:grid; place-items:center; border-radius:50%; background:var(--cm-soft); color:var(--cm-teal); font-weight:600; }
#care-monitor-screens .cm-banner { display:flex; align-items:center; gap:8px; margin-bottom:16px; padding:10px 12px; border-radius:11px; background:var(--cm-soft); color:var(--cm-teal); font-size:12px; }
#care-monitor-screens .cm-banner svg { flex-shrink:0; }
#care-monitor-screens .cm-panel { background:var(--cm-surface); border:1px solid var(--cm-border); border-radius:18px; padding:16px; margin:0 0 12px; }
#care-monitor-screens .cm-person { display:flex; align-items:center; gap:12px; }
#care-monitor-screens .cm-person strong { font-size:16px; font-weight:600; }
#care-monitor-screens .cm-person p { margin:3px 0 0; color:var(--cm-muted); font-size:12px; }
#care-monitor-screens .cm-badge { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:14px; color:var(--cm-teal); background:var(--cm-soft); font-size:11px; }
#care-monitor-screens .cm-section-label { display:flex; justify-content:space-between; align-items:center; margin:19px 0 10px; gap:8px; }
#care-monitor-screens .cm-section-label h2 { font-size:16px; margin:0; font-weight:600; }
#care-monitor-screens .cm-section-label span { font-size:11px; color:var(--cm-muted); }
#care-monitor-screens .cm-metrics { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
#care-monitor-screens .cm-metric { padding:16px 13px; min-width:0; }
#care-monitor-screens .cm-metric-label { display:flex; gap:6px; align-items:center; font-size:12px; color:var(--cm-muted); }
#care-monitor-screens .cm-metric-value { display:flex; gap:5px; align-items:baseline; margin:11px 0 3px; }
#care-monitor-screens .cm-metric-value strong { font-size:32px; line-height:1; font-weight:600; letter-spacing:-1px; }
#care-monitor-screens .cm-metric-value span { color:var(--cm-muted); font-size:12px; }
#care-monitor-screens .cm-tiny { color:var(--cm-muted); font-size:11px; margin:5px 0 0; }
#care-monitor-screens .cm-muted { color:var(--cm-muted); }
#care-monitor-screens .cm-row { display:flex; align-items:center; gap:11px; padding:13px 0; border-bottom:1px solid var(--cm-border); }
#care-monitor-screens .cm-row:last-child { border-bottom:0; padding-bottom:0; }
#care-monitor-screens .cm-row:first-child { padding-top:0; }
#care-monitor-screens .cm-row-icon { width:35px; height:35px; border-radius:11px; display:grid; place-items:center; color:var(--cm-teal); background:var(--cm-soft); flex-shrink:0; }
#care-monitor-screens .cm-row-body { flex:1; min-width:0; }
#care-monitor-screens .cm-row-body strong { font-size:13px; font-weight:600; }
#care-monitor-screens .cm-row-body small { display:block; font-size:11px; color:var(--cm-muted); margin-top:2px; }
#care-monitor-screens .cm-row-value { text-align:right; font-size:12px; }
#care-monitor-screens .cm-nav { display:grid; grid-template-columns:repeat(4,1fr); background:var(--cm-surface); border-top:1px solid var(--cm-border); padding:10px 5px 18px; }
#care-monitor-screens .cm-nav button { display:flex; flex-direction:column; gap:4px; align-items:center; border:0; padding:8px 0; background:transparent; color:var(--cm-muted); font-size:11px; border-radius:11px; }
#care-monitor-screens .cm-nav button[aria-current=page] { color:var(--cm-teal); background:var(--cm-soft); }
#care-monitor-screens .cm-button { display:flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:13px; min-height:46px; padding:11px 16px; background:var(--cm-teal); color:var(--cm-on-teal) !important; font-weight:600 !important; width:100%; }
#care-monitor-screens .cm-button.secondary { color:var(--cm-teal) !important; background:var(--cm-soft); }
#care-monitor-screens .cm-link { border:0; background:transparent; color:var(--cm-teal) !important; padding:10px 4px; }
#care-monitor-screens .cm-back { width:36px; height:36px; border:0; display:grid; place-items:center; border-radius:12px; color:var(--cm-teal); background:var(--cm-soft); }
#care-monitor-screens .cm-auth { padding:30px 27px; flex:1; }
#care-monitor-screens .cm-brand { display:flex; align-items:center; gap:10px; font-size:16px; color:var(--cm-teal); font-weight:600; margin:12px 0 45px; }
#care-monitor-screens .cm-brand-icon { width:44px; height:44px; display:grid; place-items:center; border-radius:15px; color:var(--cm-on-teal); background:var(--cm-teal); }
#care-monitor-screens .cm-auth h1 { font-size:30px; line-height:1.18; margin:0 0 14px; font-weight:600; letter-spacing:-.9px; }
#care-monitor-screens .cm-auth p { color:var(--cm-muted); margin:0 0 24px; }
#care-monitor-screens .cm-field { display:block; color:var(--cm-text); font-size:12px; margin:0 0 16px; }
#care-monitor-screens .cm-field input, #care-monitor-screens .cm-field select { display:block; width:100%; border:1px solid var(--cm-border); border-radius:12px; padding:13px 12px; margin-top:7px; color:var(--cm-text); background:var(--cm-surface); min-width:0; font-size:16px; }
#care-monitor-screens .cm-field input::placeholder { color:var(--cm-muted); }
#care-monitor-screens .cm-note { padding:12px; margin:16px 0; font-size:12px; border-radius:11px; background:var(--cm-soft); color:var(--cm-teal); }
#care-monitor-screens .cm-auth-bottom { margin:12px 0 0; text-align:center; font-size:12px; color:var(--cm-muted); }
#care-monitor-screens .cm-full-row { display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:1px solid var(--cm-border); border-radius:16px; padding:14px; background:var(--cm-surface); margin-bottom:10px; }
#care-monitor-screens .cm-full-row .cm-chevron { color:var(--cm-muted); }
#care-monitor-screens .cm-alert-card { color:var(--cm-alert); background:var(--cm-alert-bg); border:0; }
#care-monitor-screens .cm-alert-card .cm-row-icon { color:var(--cm-alert); background:var(--cm-surface); }
#care-monitor-screens .cm-detail-hero { padding:23px 18px; text-align:center; }
#care-monitor-screens .cm-detail-hero h2 { margin:11px 0 4px; font-size:20px; font-weight:600; }
#care-monitor-screens .cm-detail-hero strong { font-size:48px; font-weight:600; letter-spacing:-1.4px; }
#care-monitor-screens .cm-details { margin:0; }
#care-monitor-screens .cm-details div { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:11px 0; border-bottom:1px solid var(--cm-border); }
#care-monitor-screens .cm-details div:last-child { border:0; }
#care-monitor-screens .cm-details dt { color:var(--cm-muted); font-size:12px; }
#care-monitor-screens .cm-details dd { margin:0; text-align:right; font-size:13px; }
#care-monitor-screens .cm-section-body { font-size:12px; color:var(--cm-muted); margin:8px 0; }
#care-monitor-screens .cm-center { text-align:center; }
#care-monitor-screens .cm-check { display:flex; align-items:flex-start; gap:8px; font-size:12px; color:var(--cm-muted); margin:4px 0 20px; }
#care-monitor-screens .cm-check input { accent-color:var(--cm-teal); margin:3px 0 0; }
#care-monitor-screens .cm-offline { color:var(--cm-alert); background:var(--cm-alert-bg); }
#care-monitor-screens .cm-button:disabled { opacity:.55; }
#care-monitor-screens .cm-metric-value strong { overflow-wrap:anywhere; }
#care-monitor-screens[data-density=compact] .cm-main { padding-top:4px; }
#care-monitor-screens[data-density=compact] .cm-panel { padding:12px; margin-bottom:10px; }
#care-monitor-screens[data-density=compact] .cm-row { padding-top:9px; padding-bottom:9px; }
@media(max-width:420px) { #care-monitor-screens .cm-phone { border-radius:20px; } #care-monitor-screens .cm-main { padding-left:15px; padding-right:15px; } #care-monitor-screens .cm-auth { padding:23px; } }
</style>
<script>
(() => {
  const root = document.getElementById('care-monitor-screens');
  const content = root.querySelector('#cm-content');
  const screenSelect = root.querySelector('#cm-screen');
  const scenarioSelect = root.querySelector('#cm-scenario');
  const screens = ['login','signup','overview','sensors','sensor-detail','alerts','alert-detail','settings'];
  const scenarios = ['routine','alert','unavailable','offline'];
  const state = { screen:'login', scenario:'routine', acknowledged:false, sensor:'MAX30102', density:'comfortable' };
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (label, action, cls='cm-button') => `<button type="button" class="${cls} cursor-interaction" data-action="${action}">${label}</button>`;
  const top = (title, sub, back) => `<div class="cm-top">${back?button(icon('arrow-left'),'screen:'+back,'cm-back'):''}<div style="flex:1"><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${!back?'<div class="cm-avatar">AM</div>':''}</div>`;
  const banner = () => `<div class="cm-banner">${icon('flask-conical')}<span><strong>DEMO MODE</strong> · Simulated sensor data</span></div>`;
  const nav = () => `<nav class="cm-nav" aria-label="Main navigation">${[['overview','house','Overview'],['sensors','activity','Sensors'],['alerts','bell','Alerts'],['settings','settings','Settings']].map(([route,ic,label])=>`<button type="button" class="cursor-interaction" data-action="screen:${route}" ${state.screen===route?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}</nav>`;
  const rows = items => items.map(([ic,title,sub,value])=>`<div class="cm-row"><div class="cm-row-icon">${icon(ic)}</div><div class="cm-row-body"><strong>${title}</strong><small>${sub}</small></div><div class="cm-row-value">${value}</div></div>`).join('');
  const details = items => `<dl class="cm-details">${items.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  function health() { const off=state.scenario==='offline', absent=state.scenario==='unavailable'; return {off,absent, hr:off||absent?'—':'76',spo2:off||absent?'—':state.scenario==='alert'?'92':'98',temp:off?'—':'33.5',ambient:off?'—':'24.1',status:off?'Offline':absent?'No finger':'Available'}; }
  function auth(signup) { return `<main class="cm-auth"><div class="cm-brand"><div class="cm-brand-icon">${icon('heart-pulse')}</div>Care Monitor</div><h1>${signup?'Create your<br>demo profile':'Welcome to<br>Care Monitor'}</h1><p>${signup?'Preview the account setup for your care team.':'A clear view of your loved one’s daily health.'}</p><form id="cm-auth-form">${signup?'<label class="cm-field">Display name<input type="text" autocomplete="off" placeholder="Alex Morgan" aria-label="Display name"></label>':''}<label class="cm-field">Email address<input type="email" autocomplete="off" placeholder="caregiver@example.com" aria-label="Email address"></label><label class="cm-field">Sample password<input type="password" autocomplete="off" placeholder="Demo only · not saved" aria-label="Sample password"></label>${signup?'<label class="cm-field">Confirm sample password<input type="password" autocomplete="off" placeholder="Repeat the sample password" aria-label="Confirm sample password"></label>':''}<button type="submit" class="cm-button cursor-interaction">${signup?'Preview account setup':'Sign in to demo'}</button></form><div class="cm-note">Demo interface only. No account is created and no password is stored.</div>${signup?button('Already have an account? Sign in','screen:login','cm-link'):button('Explore demo','screen:overview','cm-button secondary')}<div class="cm-auth-bottom">${signup?'':`New to Care Monitor? ${button('Create account','screen:signup','cm-link')}`}</div></main>`; }
  function overview() { const h=health(); return `${top('Overview','Your care dashboard')}${banner()}<div class="cm-panel cm-person"><div class="cm-avatar">P</div><div style="flex:1"><strong>Demo patient 001</strong><p>Device · elder-demo-01</p></div><span class="cm-badge ${h.off?'cm-offline':''}">${h.off?'Offline':'Demo'}</span></div>${h.off?'<div class="cm-banner cm-offline">Device offline · No current readings</div>':''}<div class="cm-section-label"><h2>Latest readings</h2><span>Simulated snapshot</span></div><div class="cm-metrics"><div class="cm-panel cm-metric"><div class="cm-metric-label">${icon('heart-pulse')}Heart rate</div><div class="cm-metric-value"><strong>${h.hr}</strong><span>BPM</span></div><p class="cm-tiny">${h.status}</p></div><div class="cm-panel cm-metric"><div class="cm-metric-label">${icon('droplets')}Blood oxygen</div><div class="cm-metric-value"><strong>${h.spo2}</strong><span>% SpO₂</span></div><p class="cm-tiny">${state.scenario==='alert'?'Demo threshold crossed':h.status}</p></div></div><div class="cm-panel">${rows([['thermometer','Surface temperature','GY906 · Object temperature',h.temp+' °C'],['sun','Ambient temperature','GY906 · Surrounding air',h.ambient+' °C']])}</div><div class="cm-section-label"><h2>Other modules</h2>${button('View all','screen:sensors','cm-link')}</div><div class="cm-panel">${rows([['move','Motion','MPU6050 · Acceleration + gyro',h.off?'Unavailable':'1.00 g · Z'],['mic','Sound level','Microphone · Raw ADC',h.off?'Unavailable':'150 ADC'],['sun','Light level','Photoresistor · ADC percentage',h.off?'Unavailable':'48.8%'],['volume-2','Buzzer','GPIO 25 · Output actuator','State unknown']])}</div>${state.scenario==='alert'?button('View low oxygen alert','screen:alert-detail','cm-button secondary'):''}`; }
  function sensors() { const h=health(); return `${top('Sensors','Five sensors · One buzzer')}${banner()}<div class="cm-section-label"><h2>Connected modules</h2><span>elder-demo-01</span></div>${[['MAX30102','heart-pulse','Heart rate · SpO₂ · Red + IR',h.status],['GY906','thermometer','Object + ambient temperature',h.off?'Offline':'Available'],['MPU6050','move','Acceleration + gyroscope',h.off?'Offline':'Available'],['Microphone','mic','Raw sound ADC',h.off?'Offline':'Available'],['Photoresistor','sun','Raw ADC + ADC percentage',h.off?'Offline':'Available'],['Buzzer','volume-2','GPIO 25 · Output actuator','State unknown']].map(([name,ic,sub,status])=>`<button type="button" class="cm-full-row cursor-interaction" data-action="sensor:${name}"><div class="cm-row-icon">${icon(ic)}</div><div class="cm-row-body"><strong>${name}</strong><small>${sub}</small><small>${status}</small></div><span class="cm-chevron">${icon('chevron-right')}</span></button>`).join('')}<p class="cm-tiny">Raw ADC values are not calibrated physical units.</p>`; }
  function sensorDetail() { const h=health(), n=state.sensor; let data,note,ic; if(n==='MAX30102'){ic='heart-pulse';data=[['Heart rate',h.hr+' BPM'],['Blood oxygen',h.spo2+'%'],['IR raw',h.off?'Unavailable':h.absent?'300':'92000'],['Red raw',h.off?'Unavailable':h.absent?'200':'81000'],['Sample window',h.off?'Unavailable':h.absent?'0 / 100':'75 / 100'],['Reading status',h.status]];note='Heart rate and SpO₂ are estimates. Invalid readings stay unavailable.';} else if(n==='GY906'){ic='thermometer';data=[['Object temperature',h.temp+' °C'],['Ambient temperature',h.ambient+' °C'],['Status',h.off?'Offline':'Available']];note='Object temperature measures the observed surface, not core body temperature.';} else if(n==='MPU6050'){ic='move';data=[['Acceleration X',h.off?'Unavailable':'0.02 g'],['Acceleration Y',h.off?'Unavailable':'−0.01 g'],['Acceleration Z',h.off?'Unavailable':'1.00 g'],['Gyroscope X',h.off?'Unavailable':'0.10 °/s'],['Gyroscope Y',h.off?'Unavailable':'−0.20 °/s'],['Gyroscope Z',h.off?'Unavailable':'0.00 °/s']];note='Motion readings are shown directly. Fall detection is not implemented.';} else if(n==='Microphone'){ic='mic';data=[['ADC raw',h.off?'Unavailable':'150'],['Status',h.off?'Offline':'Available']];note='This is an uncalibrated ADC reading, not a decibel measurement.';} else if(n==='Photoresistor'){ic='sun';data=[['ADC raw',h.off?'Unavailable':'2000'],['ADC percentage',h.off?'Unavailable':'48.8%'],['Status',h.off?'Offline':'Available']];note='The percentage is a fraction of the ADC range, not a lux measurement.';} else{ic='volume-2';data=[['GPIO pin','25'],['Output state','Unknown'],['Remote control','Not connected']];note='The firmware reports the pin only. No remote buzzer control is available.';} return `${top(n,'Sensor details','sensors')}${banner()}<div class="cm-panel cm-detail-hero"><div class="cm-row-icon" style="margin:auto">${icon(ic)}</div><h2>${n}</h2><span class="cm-badge">${n==='Buzzer'?'Output actuator':'Simulated readings'}</span></div><div class="cm-panel">${details(data)}</div><div class="cm-note">${note}</div>`; }
  function alerts() { return `${top('Alerts','Review and acknowledge')}${banner()}<div class="cm-section-label"><h2>Demo notifications</h2><span>Session only</span></div><button type="button" class="cm-full-row cm-alert-card cursor-interaction" data-action="screen:alert-detail"><div class="cm-row-icon">${icon('bell-ring')}</div><div class="cm-row-body"><strong>Low blood oxygen</strong><small style="color:inherit">Demo patient 001 · 92% SpO₂</small><small style="color:inherit">${state.acknowledged?'Acknowledged':'Needs review'} · Demo example</small></div>${icon('chevron-right')}</button><div class="cm-panel">${rows([['check-check','No other demo alerts','No push notifications connected','']])}</div><p class="cm-section-body">This example is generated locally. Live alerts require the backend alert service.</p>`; }
  function alertDetail() { return `${top('Alert details','Demo notification','alerts')}${banner()}<div class="cm-panel cm-detail-hero cm-alert-card"><div class="cm-row-icon" style="margin:auto">${icon('bell-ring')}</div><h2>Low blood oxygen</h2><strong>92<span style="font-size:24px">%</span></strong><p style="margin:4px 0 0">SpO₂ · Simulated example</p></div><div class="cm-panel">${details([['Patient','Demo patient 001'],['Device','elder-demo-01'],['Source','MAX30102'],['Demo rule','SpO₂ below 95%'],['Status',state.acknowledged?'Acknowledged':'Needs review']])}</div><div class="cm-note">Classroom demonstration threshold. This is not a validated clinical alert rule.</div>${state.acknowledged?'<div class="cm-banner">Acknowledged for this demo session</div>':button('Acknowledge (demo)','ack')}<p class="cm-tiny cm-center">No server update or notification is sent.</p>`; }
  function settings() { return `${top('Settings','Demo and connection setup')}${banner()}<div class="cm-panel cm-person"><div class="cm-avatar">AM</div><div><strong>Care provider</strong><p>Local demo profile</p></div></div><div class="cm-section-label"><h2>Data connection</h2><span>Demo only</span></div><div class="cm-panel"><label class="cm-field">Server URL draft<input id="cm-url" type="url" value="http://192.168.1.100:8000" aria-label="Server URL draft"></label><p class="cm-section-body">Preview field only. This version does not request live sensor data.</p></div><div class="cm-panel">${details([['Device','elder-demo-01'],['Data source','Bundled demo snapshot'],['Authentication','Not connected'],['Push notifications','Not connected'],['Buzzer control','Not connected']])}</div>${button('Sign out of demo','screen:login','cm-button secondary')}<p class="cm-tiny cm-center">Care Monitor · Android prototype</p>`; }
  function render() { screenSelect.value=state.screen;scenarioSelect.value=state.scenario;root.dataset.density=state.density; if(state.screen==='login'||state.screen==='signup'){content.innerHTML=auth(state.screen==='signup');}else{const view=state.screen==='overview'?overview():state.screen==='sensors'?sensors():state.screen==='sensor-detail'?sensorDetail():state.screen==='alerts'?alerts():state.screen==='alert-detail'?alertDetail():settings(); content.innerHTML=`<main class="cm-main">${view}</main>${nav()}`;} if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}}); }
  function restore(v) { const s=v&&v.modelContent?v.modelContent:v; if(!s||typeof s!=='object')return; if(screens.includes(s.screen))state.screen=s.screen;if(scenarios.includes(s.scenario))state.scenario=s.scenario;if(typeof s.acknowledged==='boolean')state.acknowledged=s.acknowledged; if(typeof s.sensor==='string'&&['MAX30102','GY906','MPU6050','Microphone','Photoresistor','Buzzer'].includes(s.sensor))state.sensor=s.sensor; }
  function save() { if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{screen:state.screen,scenario:state.scenario,acknowledged:state.acknowledged,sensor:state.sensor},privateContent:{density:state.density}}).catch(()=>{}); }
  root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a.startsWith('screen:'))state.screen=a.slice(7);else if(a.startsWith('sensor:')){state.sensor=a.slice(7);state.screen='sensor-detail';}else if(a==='ack')state.acknowledged=true;render();save();});
  root.addEventListener('submit',e=>{e.preventDefault();state.screen='overview';render();save();});
  screenSelect.addEventListener('change',()=>{state.screen=screenSelect.value;render();save();});
  scenarioSelect.addEventListener('change',()=>{state.scenario=scenarioSelect.value;render();save();});
  window.addEventListener('openai:set_globals',e=>{const v=e.detail&&e.detail.globals&&e.detail.globals.widgetState;if(v){restore(v);render();}});
  if(window.openai)restore(window.openai.widgetState);render();
  if(globalThis.Tweak){const t=new Tweak({container:root.querySelector('.cm-phone'),onChange:render});t.addSelect(state,'density',{label:'Spacing',options:['comfortable','compact']});}
})();
</script>
