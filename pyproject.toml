[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "caremonitor"
version = "1.0.0"
description = "Educational elder-care gateway with explicit consent and private care circles"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.5",
  "argon2-cffi==25.1.0", "cryptography==48.0.0", "httpx==0.28.1",
]

[project.optional-dependencies]
ml = ["numpy==2.4.6", "scikit-learn==1.8.0", "pandas==2.3.3", "joblib==1.5.3", "matplotlib==3.10.9"]
dev = ["pytest==9.0.3", "pyserial==3.5"]

[project.scripts]
caremonitor = "caremonitor.cli:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
addopts = "-q"
