<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Candidate fall-response state machine</title><desc id="desc">Isolated software-tested event response; no physical fall detector or phone push delivery.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526477"/></marker><style>text{font-family:Arial,sans-serif;fill:#183047}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#51677d}.head{font-size:21px;font-weight:700}.body{font-size:18px}.label{font-size:16px;font-weight:700;fill:#34546c}</style></defs><rect width="1440" height="800" fill="#f7f9fc"/><text x="40" y="55" class="title">Candidate fall-response state machine — software tested</text><text x="40" y="88" class="sub">Response to an authorized event; not automatic fall detection and not a group physical fall trial.</text>
